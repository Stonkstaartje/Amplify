<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amplify Upload & Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand">Amplify</div>
          <nav class="top-nav">
            <button type="button" class="top-nav-button active">Home</button>
            <button type="button" class="top-nav-button">Search</button>
          </nav>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
            <input id="search" type="search" placeholder="Wat wil je afspelen?" />
          </div>
          <button id="open-upload-modal" type="button" class="add-track-button">Add track</button>
        </div>
      </header>

      <div class="content-grid">
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2>Bibliotheek</h2>
            <button id="open-playlist-modal" class="playlist-create">Maken</button>
          </div>
          <div id="playlist-list" class="playlist-list"></div>
        </aside>

        <main class="main-view">
          <section class="tracks-card">
            <div class="tracks-header">
              <div>
                <h2 id="track-list-title">Tracks</h2>
                <p id="playlist-details" class="playlist-details">Alle nummers worden hier getoond.</p>
              </div>
              <span class="track-count" id="track-count">0 nummers</span>
            </div>
            <div class="track-table-header">
              <span>#</span>
              <span></span>
              <span>Titel</span>
              <span>Album</span>
              <span>Toegevoegd</span>
              <span>Duur</span>
              <span></span>
            </div>
            <div id="tracks-list" class="tracks-list"></div>
          </section>
        </main>
      </div>

      <div id="upload-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="upload-title">
        <div class="modal-dialog">
          <button type="button" id="close-upload-modal" class="modal-close" aria-label="Sluit">×</button>
          <h2 id="upload-title">Upload een track</h2>
          <form id="upload-form">
            <label>
              Titel
              <input type="text" name="title" placeholder="Track titel" />
            </label>
            <label>
              Artiest
              <input type="text" name="artist" placeholder="Artiest" />
            </label>
            <label>
              Album
              <input type="text" name="album" placeholder="Album (optioneel)" />
            </label>
            <label>
              Bestand
              <input type="file" name="audio" accept="audio/*" required />
            </label>
            <label>
              Hoesfoto
              <input type="file" name="cover" accept="image/jpeg,image/png,image/webp" />
            </label>
            <button type="submit" class="upload-submit">Uploaden</button>
          </form>
          <div id="upload-feedback" class="feedback"></div>
        </div>
      </div>

      <div id="playlist-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="playlist-title">
        <div class="modal-dialog">
          <button type="button" id="close-playlist-modal" class="modal-close" aria-label="Sluit">×</button>
          <h2 id="playlist-title">Maak playlist</h2>
          <form id="playlist-form">
            <label>
              Naam
              <input type="text" name="name" placeholder="Playlist naam" required />
            </label>
            <label>
              Beschrijving
              <input type="text" name="description" placeholder="Beschrijving" />
            </label>
            <button type="submit" class="upload-submit">Opslaan</button>
          </form>
          <div id="playlist-feedback" class="feedback"></div>
        </div>
      </div>

      <footer class="player-footer">
        <div class="player-left">
          <div id="player-cover" class="player-cover" aria-label="Albumhoes">♫</div>
          <div>
            <div id="player-info" class="player-info">Selecteer een track om te spelen.</div>
            <div id="player-artist" class="player-artist"></div>
            <div id="player-quality-subtle" class="player-quality-subtle"></div>
          </div>
        </div>

        <div class="player-center">
          <div class="player-controls">
            <button id="prev-track" class="footer-button" type="button" aria-label="Vorige">&#9664;&#9664;</button>
            <button id="play-pause" class="footer-button" type="button" aria-label="Play/Pause">▶</button>
            <button id="next-track" class="footer-button" type="button" aria-label="Volgende">&#9654;&#9654;</button>
          </div>
          <div class="progress-wrapper footer-progress">
            <span id="current-time">0:00</span>
            <input id="seek" class="progress-bar" type="range" min="0" max="100" value="0" step="0.1" />
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="player-right">
          <span class="volume-label">Vol</span>
          <input id="volume" class="volume-slider" type="range" min="0" max="1" step="0.01" value="1" />
        </div>
      </footer>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    <script src="app.js"></script>
</body>
</html>
